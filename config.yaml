# config.yaml: non-secret project parameters (committed, Claude may edit).
# Secrets go in .env, never here. See universal-rules §5.

project:
  log_level: info

data:
  raw_dir: data/raw
  processed_dir: data/processed   # saved tables use Parquet

phase:
  # Phase labeller (specs/position_pipeline_spec.md §3). Checked in order: endgame, opening, middlegame.
  # Endgame tests are per side: every side must pass at least one of the three.
  # Pieces = queens, rooks, bishops, knights (kings and pawns never count).
  endgame_max_pieces_per_side: 2   # endgame if each side has at most this many pieces...
  endgame_max_points_per_side: 8   # ...or at most this many points of them
  endgame_max_pieces_per_side_without_queen: 3   # ...or, with no queen, at most this many pieces
  opening_before_move: 12          # opening if from a named line, or move number below this
  piece_values:
    queen: 9
    rook: 5
    bishop: 3
    knight: 3

engine:
  # Stockfish is pinned so stored evaluations, live scoring and CI all use the same engine.
  # Download or refresh it with: uv run python scripts/get_stockfish.py
  version: sf_19
  path: tools/stockfish/stockfish   # ".exe" is added on Windows
  depth: 18                         # fixed depth + 1 thread keeps results reproducible
  threads: 1
  hash_mb: 64
  multipv: 3                        # how many top moves to show
  sha256:                           # release-asset checksums (match GitHub's published digests)
    stockfish-windows-x86-64-universal.zip: 3c8bf1f9ea66a09350a40df4f632288285ac206d99f33ab5842c408fc30b48a7
    stockfish-linux-x86-64-universal.tar.gz: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
    stockfish-macos-universal.tar.gz: a1f0e3bcc5a6927a11fe6fc8e54a779754645f3c2bae2cf13420fd1957adaa77

openings:
  # Opening importer (specs/position_pipeline_spec.md §4). Source: lichess-org/chess-openings (CC0),
  # pinned to one commit so imports can be reproduced. Download with:
  #   uv run python scripts/get_openings.py
  # then import with: uv run --env-file .env python -m chess_training.openings
  repo: lichess-org/chess-openings
  commit: 3ba6b20d31b2e6125cb0e6a2e792f400717d9d39   # 2026-11-05
  subdir: openings                  # under data.raw_dir
  max_fullmove: 10                  # keep positions through Black's 10th move (20 half-moves)
  sha256:
    a.tsv: 3282e4c9155289a29224f9a85fba0decb46efa35c2fa5e39662d2ac48fb0f793
    b.tsv: 2744a3890879bd9dce79093147fe5b6c3a9d9d42a3388af698e67b6829be1c48
    c.tsv: 447bbd4b15d68067b150faf12bf66aa14b18582cf80d736aaa7c0081131806ef
    d.tsv: 1cf4057a8aece94f27bb3f278ad410ee2844831a642364eeceaafa091dbcceda
    e.tsv: 48c6f6645b031a5937c8386839debab0e2e48837251687ba1afb6369677f8546

puzzles:
  # Puzzle importer (specs/position_pipeline_spec.md §5). Source: the Lichess puzzle database
  # (CC0). Lichess replaces the file monthly at the same URL, so the checksum pins one dump:
  # a newer dump fails the check until it is re-pinned here. Download with:
  #   uv run python scripts/get_puzzles.py
  # then import with: uv run --env-file .env python -m chess_training.puzzles
  url: https://database.lichess.org/lichess_db_puzzle.csv.zst
  file: lichess_db_puzzle.csv.zst
  subdir: puzzles                   # under data.raw_dir
  dump_date: 2026-11-01             # Last-Modified of the pinned dump
  sha256: 7b0d235fa40cfd7fdb7df1fec56a96b3b6ee1496b32ed2eb05be90d0ebf94253
  # Sample (decided 2026-11-09)
  min_nb_plays: 100                 # quality filter: drop puzzles played fewer times
  min_popularity: 80                # quality filter: popularity runs -100..100
  sample_size: 5000
  theme_floor: 30                   # at least this many per motif theme, filled first
  rating_band_width: 200            # the rest fills bands so final totals are as even as possible
  seed: 20261111                    # fixed so the sample can be reproduced
  themes:
    # Checked against Lichess's theme file (lila translation/source/puzzleTheme.xml) on
    # 2026-11-11. Only `motif` tags count as themes (the floor and challenge-mode matching).
    motif:
      # tactical motifs
      - attraction
      - capturingDefender
      - clearance
      - deflection
      - discoveredAttack
      - discoveredCheck
      - doubleCheck
      - fork
      - hangingPiece
      - interference
      - intermezzo
      - pin
      - quietMove
      - sacrifice
      - skewer
      - trappedPiece
      - xRayAttack
      - zugzwang
      # mate patterns
      - anastasiaMate
      - arabianMate
      - backRankMate
      - balestraMate
      - blindSwineMate
      - bodenMate
      - cornerMate
      - doubleBishopMate
      - dovetailMate
      - epauletteMate
      - hookMate
      - killBoxMate
      - morphysMate
      - operaMate
      - pillsburysMate
      - smotheredMate
      - swallowstailMate
      - triangleMate
      - vukovicMate
      - mateIn1
      - mateIn2
      - mateIn3
      - mateIn4
      - mateIn5
    not_theme:
      # phase
      - opening
      - middlegame
      - endgame
      - rookEndgame
      - pawnEndgame
      - bishopEndgame
      - knightEndgame
      - queenEndgame
      - queenRookEndgame
      # length
      - oneMove
      - short
      - long
      - veryLong
      # goal
      - advantage
      - crushing
      - equality
      - mate
      # origin
      - master
      - masterVsMaster
      - superGM
    # Tags the spec didn't place. Decided 2026-11-11 (user): NOT themes. Kept as their own list so
    # it stays clear which tags were judgement calls; move one to `motif` to make it count.
    unplaced:
      - advancedPawn
      - attackingF2F7
      - castling
      - enPassant
      - exposedKing
      - kingsideAttack
      - queensideAttack
      - promotion
      - underPromotion
      - collinearMove
      - defensiveMove

analysis:
  # Batch engine analysis (specs/position_pipeline_spec.md §6, decided 2026-11-09).
  # Run with: uv run --env-file .env python -m chess_training.analysis [--limit 100]
  quick_depth: 10      # quick pass: every legal move
  deep_depth: 18       # deep pass: must equal engine.depth (the live game's depth)
  deep_margin: 15      # win-% points below the best quick-pass move that get the deep pass
  workers: 10          # parallel Stockfish processes, 1 thread each (engine.threads)

move_acceptance:
  # specs/move_acceptance_spec.md (status: ready). PLACEHOLDERS: G and L are still open
  # there and get tuned from the tuning report (python -m chess_training.acceptance_report).
  # L must stay <= analysis.deep_margin / 2 (checked when the analysis starts).
  G: 5                 # break size, win-% points (placeholder)
  L: 6                 # cap below the best move, win-% points (placeholder)

scoring:
  # specs/scoring_spec.md (status: ready). PLACEHOLDER: blunder_line is an open question there,
  # settled together with G and L. Must stay <= analysis.deep_margin.
  blunder_line: 15     # win-% points below the best move: up to here a close miss, beyond a blunder
